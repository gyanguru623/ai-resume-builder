name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Zip file ko extract karein
    - name: Unzip Project Files
      run: |
        unzip -q ai-resume-builder.zip -d extracted_project
        if [ -d "extracted_project/ai-resume-builder" ]; then
          mv extracted_project/ai-resume-builder/* ./
        else
          mv extracted_project/* ./
        fi
        rm -rf extracted_project ai-resume-builder.zip
        ls -la

    # 2. Dummy .env file create karein
    - name: Create Dummy Env File
      run: |
        touch .env.example
        echo "GEMINI_API_KEY=dummy_key" > .env.example

    # 3. Matching Package Name ke sath Dummy google-services.json create karein
    - name: Create Dummy google-services.json
      run: |
        mkdir -p app
        cat <<EOF > app/google-services.json
        {
          "project_info": {
            "project_number": "1234567890",
            "project_id": "dummy-project",
            "storage_bucket": "dummy-project.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                "android_client_info": {
                  "package_name": "com.resume.studio.ali"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "dummy_api_key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    # 4. Unnecessary resource files clean karein
    - name: Clean Resource Files
      run: |
        find . -path "*/src/main/res/mipmap/*" -name "Type.kt" -delete
        echo "Resource cleanup done."

    # 5. Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 6. Debug Keystore generate karein aur project root me copy karein
    - name: Setup Required Debug Keystore
      run: |
        mkdir -p /home/runner/.android/
        keytool -genkey -v -keystore /home/runner/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storetype JKS \
          -dname "CN=RGH Creator, O=Coding, C=IN"
        
        # Keystore ko project root folder me copy karein
        cp /home/runner/.android/debug.keystore ./debug.keystore

    # 7. Gradle wrapper executable banayein
    - name: Setup Gradle wrapper forcefully
      run: |
        gradle wrapper
        chmod +x gradlew

    # 8. APK Build karein
    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon \
          -Dorg.gradle.project.android.experimental.privacyandbox.sdkgears.enabled=false \
          -Didea.sync.active=false

    # 9. Output APK Deliverables Upload karein
    - name: Upload APK Deliverables
      uses: actions/upload-artifact@v4
      with:
        name: ai-resume-builder-APK-Package
        path: |
          **/build/outputs/apk/debug/*.apk
          
