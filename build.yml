name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Zip file ko correctly extract aur base directory me move karein
    - name: Unzip Project Files
      run: |
        unzip -q ai-resume-builder.zip -d extracted_project
        if [ -d "extracted_project/ai-resume-builder" ]; then
          mv extracted_project/ai-resume-builder/* ./
        else
          mv extracted_project/* ./
        fi
        rm -rf extracted_project ai-resume-builder.zip
        ls -la

    # 2. Missing .env.example file ko create karein
    - name: Create Dummy Env File
      run: |
        touch .env.example
        echo "GEMINI_API_KEY=dummy_key" > .env.example

    # 3. Safety Resource Cleanup
    - name: Clean Resource Files
      run: |
        find . -path "**/src/main/res/mipmap/*" -name "Type.kt" -delete
        echo "Resource cleanup done."

    # 4. Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 5. Keystore explicitly dobara create karein kyunki build.gradle isko dhoondh raha hai
    - name: Setup Required Debug Keystore
      run: |
        mkdir -p /home/runner/.android/
        keytool -genkey -v -keystore /home/runner/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storetype JKS \
          -dname "CN=RGH Creator, O=Coding, C=IN"

    # 6. Gradle wrapper forcefully generate karein
    - name: Setup Gradle wrapper forcefully
      run: |
        gradle wrapper
        chmod +x gradlew

    # 7. Build Debug APK (Android Studio plugin crash bypass properties ke sath)
    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon \
          -Dorg.gradle.project.android.experimental.privacysandbox.sdkgears.enabled=false \
          -Didea.sync.active=false

    # 8. Final Deliverables (Sirf APK) Upload Package
    - name: Upload APK Deliverables
      uses: actions/upload-artifact@v4
      with:
        name: ai-resume-builder-APK-Package
        path: |
          **/build/outputs/apk/debug/*.apk

          
